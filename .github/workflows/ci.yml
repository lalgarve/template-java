name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Lets CI be requested on demand against any branch -- e.g. a feature branch with no open PR
  # yet (Actions tab -> CI -> "Run workflow", or `gh workflow run ci.yml --ref <branch>`) --
  # without widening the push: trigger above to run on every push to every branch.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Java 21 is the project's supported baseline; LTS upgrades require an explicit
          # project decision, not an automatic CI update (memory/constitution.md, "Baseline Java
          # e upgrades de LTS").
          java-version: '21'
          cache: maven

      # Real PostgreSQL -- the docker profile is also the default one, so this is the same
      # state a plain local `mvn verify` tests. See memory/constitution.md, "Testes exigem a
      # infraestrutura de pé".
      - name: Start Postgres
        run: docker compose up -d --wait db

      - name: Run tests with coverage (docker profile)
        env:
          SPRING_PROFILES_ACTIVE: docker
        run: mvn -B verify

      # The PR comment below only gives percentages; the HTML report shows line by line what is
      # uncovered. Uploaded even when the coverage gate failed the build, which is exactly when
      # it is needed.
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: target/site/jacoco/

      # Runs even if the coverage gate above failed the build, so the PR still shows the
      # actual percentage instead of just a red check with no explanation.
      - name: Comment coverage on the PR
        if: always() && github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7
        with:
          paths: target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 0
          title: 'Cobertura de testes (JaCoCo)'
          update-comment: true

      - name: Stop Postgres
        if: always()
        run: docker compose down -v
