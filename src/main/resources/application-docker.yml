# Real PostgreSQL in containers -- local via docker-compose, or CI. Disposable: the app owns the
# schema and runs Flyway itself. Default profile (application.yml), so it is also what tests use;
# start it first with `docker compose up -d --wait db`. See memory/constitution.md,
# "Nomenclatura de ambientes" and "Testes exigem a infraestrutura de pé".
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/deployo_template_java}
    username: ${SPRING_DATASOURCE_USERNAME:deployo_template_java_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:deployo_template_java_admin}
  flyway:
    enabled: true
