services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: deployo_template_java
      POSTGRES_USER: deployo_template_java_admin
      POSTGRES_PASSWORD: deployo_template_java_admin
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployo_template_java_admin -d deployo_template_java"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
